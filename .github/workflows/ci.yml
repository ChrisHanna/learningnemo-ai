name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  references:
    name: NeMo reference exercises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reference tests
        working-directory: references/nemo
        run: python -m unittest discover -p 'test_*.py'
      - name: Verify execution evidence
        working-directory: references/nemo
        run: python support_agent.py --check-evidence

  verified-nemo:
    name: Verified ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nooa
            requirements: nooa.txt
            run: python nooa_reference.py
          - name: nemoguardrails
            requirements: nemoguardrails.txt
            run: python guardrails_attack.py
          - name: nemo-evaluator
            requirements: nemo-evaluator.txt
            run: |
              python mock_model.py &
              nel validate -b ./evaluator/byob.py --model-url http://127.0.0.1:8000/v1 --model-id synthetic --samples 10
              nel eval run --bench ./evaluator/byob.py --model-url http://127.0.0.1:8000/v1 --model-id synthetic --max-problems 10 --output-dir reports/candidate
              nel eval report reports/candidate -f json -o reports/candidate.json
              cp -a reports/candidate reports/baseline
              nel compare reports/baseline reports/candidate --strict
              nel gate reports/baseline reports/candidate --policy evaluator/policy.yaml --strict
          - name: nemo-anonymizer
            requirements: nemo-anonymizer.txt
            run: anonymizer validate --source synthetic/customers.csv --text-column text --replace redact --no-emit-telemetry && anonymizer preview --source synthetic/customers.csv --text-column text --replace redact --num_records 1 --no-emit-telemetry && anonymizer run --source synthetic/customers.csv --text-column text --replace redact --output /tmp/anonymized-redact.csv --no-emit-telemetry && anonymizer preview --source synthetic/customers.csv --text-column text --replace hash --num_records 1 --no-emit-telemetry && anonymizer run --source synthetic/customers.csv --text-column text --replace hash --output /tmp/anonymized-hash.csv --no-emit-telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned project
        working-directory: references/verified
        run: python -m pip install --requirement requirements/${{ matrix.requirements }}
      - name: Execute synthetic reference path
        working-directory: references/verified
        run: |
          set -o pipefail
          eval "${{ matrix.run }}" 2>&1 | tee "$RUNNER_TEMP/output.txt"
      - name: Capture sanitized evidence
        working-directory: references/verified
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from importlib.metadata import version
          name = "${{ matrix.name }}"
          package = {"nooa": "nooa", "nemoguardrails": "nemoguardrails", "nemo-evaluator": "nemo-evaluator", "nemo-anonymizer": "nemo-anonymizer"}[name]
          output = open(os.environ["RUNNER_TEMP"] + "/output.txt").read()
          decisions = {"nooa": "blocked", "nemoguardrails": "after", "nemo-evaluator": "gate", "nemo-anonymizer": "redact"}[name]
          if decisions not in output.lower():
              raise SystemExit(f"expected {decisions!r} in sanitized output")
          evidence = {"product": name, "package": package, "version": version(package), "commit": os.environ["GITHUB_SHA"], "timestamp": datetime.now(timezone.utc).isoformat(), "input": "synthetic", "provenance": "GitHub Actions", "sanitized_output": output[-2000:]}
          os.makedirs("evidence", exist_ok=True)
          json.dump(evidence, open(f"evidence/{name}.json", "w"), indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nemo-${{ matrix.name }}-evidence
          path: references/verified/evidence/

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run build
