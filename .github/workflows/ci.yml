name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  references:
    name: NeMo reference exercises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reference tests
        working-directory: references/nemo
        run: python -m unittest discover -p 'test_*.py'
      - name: Verify execution evidence
        working-directory: references/nemo
        run: python support_agent.py --check-evidence

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run build
